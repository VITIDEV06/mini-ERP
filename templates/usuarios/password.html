{% extends 'base.html' %}
{% block title %}Cambiar contraseña{% endblock %}
{% block page_title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="card" style="max-width: 700px">
  <div class="card-header">Usuario: {{ usuario_obj.username }}</div>
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'includes/form_fields.html' %}
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary"><i class="bi bi-key me-1"></i> Actualizar contraseña</button>
        <a href="{% url 'usuarios:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
