<header class="topbar d-flex align-items-center gap-3 px-3 px-lg-4 bg-white border-bottom sticky-top">
  <button class="btn btn-outline-secondary btn-sm d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Abrir menú">
    <i class="bi bi-list fs-5"></i>
  </button>
  <h1 class="h5 mb-0 text-truncate">{% block page_title %}{% endblock %}</h1>
  <div class="ms-auto dropdown">
    <button class="btn btn-light d-flex align-items-center gap-2 dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
      <span class="avatar">{{ user.username|first|upper }}</span>
      <span class="d-none d-sm-inline text-start lh-sm">
        <span class="d-block fw-semibold">{{ user }}</span>
        <small class="text-muted">{{ user.get_rol_display }}</small>
      </span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
      <li><span class="dropdown-item-text small text-muted">Sesión: {{ user.username }}</span></li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</button>
        </form>
      </li>
    </ul>
  </div>
</header>
